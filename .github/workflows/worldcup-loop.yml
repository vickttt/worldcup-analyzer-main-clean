name: WorldCup Codex Claude Loop

on:
  pull_request:
    branches:
      - dev-clean
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  round-2-ci:
    name: Round 2 CI gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          if [[ -f requirements-dev.txt ]]; then pip install -r requirements-dev.txt; fi

      - name: Import validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py
          find modules -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: API-Football only runtime gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_api_football_only.py --round 1 | tee worldcup_round_1.log

      - name: Fixture mapping and odds validation
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          python scripts/validate_api_football_only.py --round 2 | tee worldcup_round_2.log

      - name: Stability and import fallback validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_api_football_only.py --round 3 | tee worldcup_round_3.log

      - name: Streamlit startup test on 8501
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py \
            --server.port 8501 \
            --server.address 127.0.0.1 \
            --server.headless true \
            > streamlit_8501.log 2>&1 &
          pid="$!"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "streamlit_health=ok" | tee streamlit_health.log
              kill "$pid"
              wait "$pid" || true
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat streamlit_8501.log
              exit 1
            fi
            sleep 2
          done
          cat streamlit_8501.log
          kill "$pid" || true
          exit 1

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldcup-loop-ci-logs
          path: |
            worldcup_round_1.log
            worldcup_round_2.log
            worldcup_round_3.log
            streamlit_8501.log
            streamlit_health.log
            reports/api_football_only/*.json

  round-3-claude:
    name: Round 3 Claude review gate
    runs-on: ubuntu-latest
    needs: round-2-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          python -m pip install anthropic python-dotenv

      - name: Build Claude review packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/claude_reviews
          base_ref="${{ github.event.pull_request.base.sha || github.sha }}"
          head_ref="${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --stat "${base_ref}" "${head_ref}" > worldcup_diff_stat.log || true
          git diff --name-only "${base_ref}" "${head_ref}" > worldcup_changed_files.log || true
          git diff --no-ext-diff --unified=20 "${base_ref}" "${head_ref}" \
            -- .github scripts modules app.py README.md docs \
            > worldcup_scoped_diff.log || true
          python scripts/validate_api_football_only.py --round 1 > worldcup_round_1.log
          python scripts/validate_api_football_only.py --round 3 > worldcup_round_3.log
          {
            echo "# WorldCup Loop Claude Review Packet"
            echo
            echo "## Required Claude Output"
            echo
            echo "Return PASS or FAIL in the verdict section. Treat unsafe scope, missing CI evidence, missing API-Football-only enforcement, or legacy provider usage as FAIL."
            echo
            echo "## Diff Stat"
            echo
            cat worldcup_diff_stat.log
            echo
            echo "## Changed Files"
            echo
            cat worldcup_changed_files.log
            echo
            echo "## Scoped Diff"
            echo
            cat worldcup_scoped_diff.log
            echo
            echo "## API-Football-Only Validation"
            echo
            cat worldcup_round_1.log
            echo
            echo "## Import And Stability Validation"
            echo
            cat worldcup_round_3.log
          } > reports/claude_reviews/worldcup_loop_packet.md

      - name: Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/github_claude_review.py --input-file reports/claude_reviews/worldcup_loop_packet.md --round 3

      - name: Enforce Claude verdict
        shell: bash
        run: |
          set -euo pipefail
          review="reports/claude_reviews/round_3_claude_review.md"
          test -s "$review"
          if grep -Eiq '(^|[^A-Z])(FAIL|BLOCKED)([^A-Z]|$)' "$review"; then
            cat "$review"
            exit 1
          fi
          if ! grep -Eiq '(^|[^A-Z])PASS(_WITH_NOTES)?([^A-Z]|$)' "$review"; then
            cat "$review"
            exit 1
          fi

      - name: Upload Claude artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldcup-loop-claude-review
          path: |
            worldcup_diff_stat.log
            worldcup_changed_files.log
            worldcup_scoped_diff.log
            reports/claude_reviews/worldcup_loop_packet.md
            reports/claude_reviews/round_3_claude_review.md
            reports/claude_reviews/round_3_claude_review.json
