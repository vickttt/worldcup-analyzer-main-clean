name: Claude Review

# Manual review only. The active repository workflow is defined in AGENTS.md:
# dev-clean only, no branch creation, no automatic Claude review loop.
on:
  workflow_dispatch:
    inputs:
      review_mode:
        description: "Manual review mode"
        required: true
        default: "packet_path"
        type: choice
        options:
          - packet_path
          - commit_range
      packet_path:
        description: "Existing sanitized packet path for packet_path mode"
        required: false
        default: "reports/claude_reviews/github_action_test_packet.md"
        type: string
      commit_range:
        description: "Git commit range for commit_range mode, for example 850c506..48dd13c"
        required: false
        default: ""
        type: string
      round:
        description: "Review round number"
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  claude-review:
    name: GitHub-mediated Claude review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev-clean
        uses: actions/checkout@v4
        with:
          ref: dev-clean
          fetch-depth: 0

      - name: Select manual review mode
        id: review
        shell: bash
        run: |
          set -euo pipefail
          review_mode="${{ inputs.review_mode }}"
          packet_path="${{ inputs.packet_path }}"
          commit_range="${{ inputs.commit_range }}"
          round="${{ inputs.round }}"
          case "${review_mode}" in
            packet_path|commit_range) ;;
            *) echo "Unsupported review_mode: ${review_mode}" >&2; exit 1 ;;
          esac
          if [[ "${review_mode}" == "packet_path" ]]; then
            case "${packet_path}" in
              reports/claude_reviews/*_review_packet.md|reports/claude_reviews/github_action_test_packet.md) ;;
              *) echo "Refusing non-packet path: ${packet_path}" >&2; exit 1 ;;
            esac
            echo "packet_path=${packet_path}" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "${commit_range}" ]]; then
              echo "commit_range is required when review_mode=commit_range" >&2
              exit 1
            fi
            echo "commit_range=${commit_range}" >> "$GITHUB_OUTPUT"
          fi
          echo "review_mode=${review_mode}" >> "$GITHUB_OUTPUT"
          echo "round=${round}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate commit range review packet
        id: commit_range_packet
        if: steps.review.outputs.review_mode == 'commit_range'
        shell: bash
        run: |
          set -euo pipefail
          packet_path="$(python scripts/prepare_commit_range_review_packet.py \
            --commit-range "${{ steps.review.outputs.commit_range }}")"
          case "${packet_path}" in
            reports/claude_reviews/*_review_packet.md) ;;
            *) echo "Generated packet has invalid path: ${packet_path}" >&2; exit 1 ;;
          esac
          echo "packet_path=${packet_path}" >> "$GITHUB_OUTPUT"

      - name: Resolve sanitized review packet
        id: packet
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.review.outputs.review_mode }}" == "commit_range" ]]; then
            input_file="${{ steps.commit_range_packet.outputs.packet_path }}"
          else
            input_file="${{ steps.review.outputs.packet_path }}"
          fi
          case "${input_file}" in
            reports/claude_reviews/*_review_packet.md|reports/claude_reviews/github_action_test_packet.md) ;;
            *) echo "Refusing non-packet input path: ${input_file}" >&2; exit 1 ;;
          esac
          echo "input_file=${input_file}" >> "$GITHUB_OUTPUT"
          echo "round=${{ steps.review.outputs.round }}" >> "$GITHUB_OUTPUT"

      - name: Install review dependencies
        run: python -m pip install --upgrade anthropic python-dotenv

      - name: Run Claude review from sanitized packet
        timeout-minutes: 8
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          CLAUDE_REVIEW_TIMEOUT_SECONDS: "90"
          CLAUDE_REVIEW_MAX_ATTEMPTS: "3"
        run: |
          python scripts/github_claude_review.py \
            --input-file "${{ steps.packet.outputs.input_file }}" \
            --round "${{ steps.packet.outputs.round }}"

      - name: Upload Claude review artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-review-round-${{ steps.packet.outputs.round }}
          path: |
            reports/claude_reviews/round_${{ steps.packet.outputs.round }}_claude_review.md
            reports/claude_reviews/round_${{ steps.packet.outputs.round }}_claude_review.json
          if-no-files-found: error
