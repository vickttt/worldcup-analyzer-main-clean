name: Claude Review

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR metadata and diff
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${PR_BASE}" --depth=1
          git diff --name-only "origin/${PR_BASE}...HEAD" > /tmp/changed_files.txt
          git diff --unified=80 "origin/${PR_BASE}...HEAD" > /tmp/pr.diff
          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "PR_TITLE=${PR_TITLE}"
            echo "PR_BASE=${PR_BASE}"
            echo "PR_HEAD=${PR_HEAD}"
            echo
            echo "PR_BODY:"
            echo "${PR_BODY}"
            echo
            echo "CHANGED_FILES:"
            cat /tmp/changed_files.txt
          } > /tmp/pr_metadata.txt

      - name: Mock Claude Review
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          changed_files = [
              line.strip()
              for line in Path("/tmp/changed_files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          diff_text = Path("/tmp/pr.diff").read_text(encoding="utf-8", errors="replace")
          pr_body = os.environ.get("PR_BODY") or ""

          protected_functions = [
              "strategy_score",
              "strategy_comparison",
              "evaluate_allocation",
          ]
          forbidden_file_patterns = [
              r"^data/history/",
              r"^data/performance_logs/",
              r"(^|/)\.env$",
              r"\.pem$",
              r"\.key$",
              r"secret",
              r"token",
          ]
          fail_reasons = []
          forbidden_files = []
          protected_function_changes = []
          data_writes = []

          for file_name in changed_files:
              if any(re.search(pattern, file_name, re.IGNORECASE) for pattern in forbidden_file_patterns):
                  forbidden_files.append(file_name)
              if file_name.startswith("data/history/"):
                  data_writes.append(file_name)

          if "app.py" in changed_files:
              app_diff = "\n".join(
                  line for line in diff_text.splitlines()
                  if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))
              )
              suspicious_terms = [
                  "recommendation",
                  "ranking",
                  "portfolio",
                  "score",
                  "default",
                  "strategy",
              ]
              if any(term in app_diff.lower() for term in suspicious_terms):
                  fail_reasons.append("app.py contains potentially product-sensitive changes.")

          for fn in protected_functions:
              if re.search(rf"^[+-]\s*def\s+{re.escape(fn)}\s*\(", diff_text, re.M):
                  protected_function_changes.append(fn)

          if protected_function_changes and "approved:ranking" not in pr_body:
              fail_reasons.append("Protected ranking function changed without approved:ranking.")

          if data_writes and "approved:data-write" not in pr_body:
              fail_reasons.append("Protected data/history files changed without approved:data-write.")

          if forbidden_files:
              fail_reasons.append("Forbidden or sensitive files changed.")

          secret_patterns = [
              r"ANTHROPIC_API_KEY\s*=",
              r"GITHUB_TOKEN\s*=",
              r"gho_[A-Za-z0-9_]+",
              r"sk-ant-[A-Za-z0-9_-]+",
              r"-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----",
          ]
          secrets_detected = any(re.search(pattern, diff_text) for pattern in secret_patterns)
          if secrets_detected:
              fail_reasons.append("Potential secret detected in diff.")

          docs_report_workflow = all(
              file_name.endswith(".md")
              or file_name.startswith(".github/")
              for file_name in changed_files
          )
          low_risk_display_copy = (
              "app.py" in changed_files
              and not protected_function_changes
              and not data_writes
              and not forbidden_files
              and not secrets_detected
              and "risk:low" in pr_body
          )

          if fail_reasons:
              status = "fail"
              risk_level = "high"
          elif docs_report_workflow or low_risk_display_copy:
              status = "pass"
              risk_level = "low"
          else:
              status = "fail"
              risk_level = "medium"
              fail_reasons.append("Mock reviewer cannot classify this PR as docs/reports/workflow/low-risk display copy.")

          result = {
              "status": status,
              "risk_level": risk_level,
              "summary": (
                  "Mock Claude Review passed: changes are low-risk."
                  if status == "pass"
                  else "Mock Claude Review failed: " + " ".join(fail_reasons)
              ),
              "changed_files": changed_files,
              "forbidden_files_changed": forbidden_files,
              "protected_functions_changed": protected_function_changes,
              "data_writes_detected": data_writes,
              "secrets_detected": secrets_detected,
              "qa_missing": [],
              "docs_missing": [],
              "scope_violations": fail_reasons,
              "required_fixes": fail_reasons,
              "auto_merge_eligible": (
                  status == "pass"
                  and risk_level == "low"
                  and not forbidden_files
                  and not protected_function_changes
                  and not data_writes
                  and not secrets_detected
              ),
              "reviewer_mode": "mock",
              "real_claude_api_called": False,
          }

          Path("claude-review-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if status != "pass":
              raise SystemExit(1)
          PY

      - name: Upload Claude Review JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-review-result
          path: claude-review-result.json
