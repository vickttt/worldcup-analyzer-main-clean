name: Claude Review / Packet Artifact

# Default manual mode can generate a packet only, or explicitly call Claude API.
# Pushes to dev-clean automatically generate a sanitized HEAD^..HEAD packet and
# run a read-only Claude API review. Claude receives only the sanitized packet.
on:
  push:
    branches:
      - dev-clean

  workflow_dispatch:
    inputs:
      packet_mode:
        description: "Artifact packet source"
        required: true
        default: "commit_range"
        type: choice
        options:
          - commit_range
      commit_range:
        description: "Optional guard range. If provided, it must resolve to current HEAD^..HEAD."
        required: false
        default: ""
        type: string
      artifact_round:
        description: "Numeric artifact round label"
        required: true
        default: "1"
        type: string
      execute_claude_review:
        description: "Explicitly call Claude API with the sanitized packet"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

jobs:
  packet-artifact:
    name: Generate sanitized packet and optional Claude review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev-clean
        uses: actions/checkout@v4
        with:
          ref: dev-clean
          fetch-depth: 0

      - name: Select review mode
        id: packet_mode
        shell: bash
        run: |
          set -euo pipefail

          packet_mode="commit_range"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            commit_range=""
            artifact_round="${{ github.run_number }}"
            execute_claude_review="true"
          else
            commit_range="${{ inputs.commit_range }}"
            artifact_round="${{ inputs.artifact_round }}"
            execute_claude_review="${{ inputs.execute_claude_review }}"
          fi

          case "${packet_mode}" in
            commit_range) ;;
            *) echo "Unsupported packet_mode: ${packet_mode}" >&2; exit 1 ;;
          esac

          case "${execute_claude_review}" in
            true|false) ;;
            *) echo "execute_claude_review must be true or false" >&2; exit 1 ;;
          esac

          if [[ "${execute_claude_review}" == "true" ]]; then
            case "${artifact_round}" in
              ''|*[!0-9]*)
                echo "artifact_round must be numeric when Claude API review is enabled" >&2
                exit 1
                ;;
            esac
          fi

          echo "commit_range=${commit_range}" >> "$GITHUB_OUTPUT"
          echo "packet_mode=${packet_mode}" >> "$GITHUB_OUTPUT"
          echo "artifact_round=${artifact_round}" >> "$GITHUB_OUTPUT"
          echo "execute_claude_review=${execute_claude_review}" >> "$GITHUB_OUTPUT"

      - name: Resolve current HEAD binding
        id: head
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run local validation before packet artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py modules/*.py scripts/*.py
          python scripts/test_portfolio_engine.py

      - name: Generate commit range packet
        id: commit_range_packet
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ steps.packet_mode.outputs.commit_range }}" ]]; then
            packet_path="$(python scripts/prepare_commit_range_review_packet.py \
              --commit-range "${{ steps.packet_mode.outputs.commit_range }}")"
          else
            packet_path="$(python scripts/prepare_commit_range_review_packet.py)"
          fi

          if [[ ! -f "${packet_path}" ]]; then
            echo "Generated packet does not exist: ${packet_path}" >&2
            exit 1
          fi

          case "$(basename "${packet_path}")" in
            *_review_packet.md) ;;
            *) echo "Generated packet has invalid filename: ${packet_path}" >&2; exit 1 ;;
          esac

          echo "packet_path=${packet_path}" >> "$GITHUB_OUTPUT"

      - name: Resolve sanitized packet
        id: packet
        shell: bash
        run: |
          set -euo pipefail

          input_file="${{ steps.commit_range_packet.outputs.packet_path }}"

          if [[ ! -f "${input_file}" ]]; then
            echo "Generated packet does not exist: ${input_file}" >&2
            exit 1
          fi

          case "$(basename "${input_file}")" in
            *"${{ steps.head.outputs.short_sha }}"*_review_packet.md) ;;
            *) echo "Generated packet is not bound to current HEAD: ${input_file}" >&2; exit 1 ;;
          esac

          echo "input_file=${input_file}" >> "$GITHUB_OUTPUT"
          echo "artifact_round=${{ steps.packet_mode.outputs.artifact_round }}" >> "$GITHUB_OUTPUT"

      - name: Confirm review mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.packet_mode.outputs.execute_claude_review }}" == "true" ]]; then
            echo "Claude API review mode is enabled."
            echo "Only the sanitized packet will be sent to Claude."
          else
            echo "Packet artifact mode only. No AI evaluation, external inference, or external AI API call is executed."
          fi

          echo "Packet artifact: ${{ steps.packet.outputs.input_file }}"

      - name: Upload sanitized packet artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-packet-round-${{ steps.packet_mode.outputs.artifact_round }}-${{ steps.head.outputs.short_sha }}
          path: |
            ${{ steps.packet.outputs.input_file }}
          if-no-files-found: error

      - name: Install Claude review dependency
        if: steps.packet_mode.outputs.execute_claude_review == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install anthropic

      - name: Prepare sanitized packet for Claude API review
        id: claude_input
        if: steps.packet_mode.outputs.execute_claude_review == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/claude_reviews
          review_input="reports/claude_reviews/$(basename "${{ steps.packet.outputs.input_file }}")"
          cp "${{ steps.packet.outputs.input_file }}" "${review_input}"
          echo "review_input=${review_input}" >> "$GITHUB_OUTPUT"

      - name: Execute read-only Claude review
        if: steps.packet_mode.outputs.execute_claude_review == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/github_claude_review.py \
            --input-file "${{ steps.claude_input.outputs.review_input }}" \
            --round "${{ steps.packet_mode.outputs.artifact_round }}"

      - name: Upload Claude review verdict artifact
        if: steps.packet_mode.outputs.execute_claude_review == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-result-round-${{ steps.packet_mode.outputs.artifact_round }}-${{ steps.head.outputs.short_sha }}
          path: |
            reports/claude_reviews/round_${{ steps.packet_mode.outputs.artifact_round }}_claude_review.md
            reports/claude_reviews/round_${{ steps.packet_mode.outputs.artifact_round }}_claude_review.json
          if-no-files-found: error
