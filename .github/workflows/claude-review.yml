name: Claude Review

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Sanitized review packet path"
        required: true
        type: string
      round:
        description: "Review round number"
        required: true
        type: string
      branch:
        description: "Branch containing the review packet"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  claude-review:
    name: GitHub-mediated Claude review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install review dependencies
        run: python -m pip install --upgrade anthropic python-dotenv

      - name: Run Claude review from sanitized packet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          python scripts/github_claude_review.py \
            --input-file "${{ inputs.input_file }}" \
            --round "${{ inputs.round }}"

      - name: Upload Claude review artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-review-round-${{ inputs.round }}
          path: |
            reports/claude_reviews/round_${{ inputs.round }}_claude_review.md
            reports/claude_reviews/round_${{ inputs.round }}_claude_review.json
          if-no-files-found: error
